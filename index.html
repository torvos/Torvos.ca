<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torvos.ca</title>
    <meta name="description" content="Torvos Personal Infrastructure">

    <link rel="stylesheet" href="css/terminal.css">
    <link rel="stylesheet" href="css/animations.css">

</head>

<body class="theme-green">

<div id="terminal-container">
    <main id="terminal">
        <div id="output"></div>
        <div id="input-line">
            <span id="prompt"></span>
            <span id="command"></span>
        </div>
        <div id="editor-container">
            <div id="editor-header">
            </div>
            <textarea id="editor"></textarea>
        </div>
        <div id="scroll-anchor"></div>
    </main>
</div>

<!-- Touch-only affordances for keys most virtual keyboards don't expose.
     Hidden on non-touch devices via CSS (see terminal.css). -->
<div id="mobile-toolbar">
    <button type="button" id="mobile-tab-btn">Tab</button>
    <button type="button" id="mobile-esc-btn">Esc</button>
</div>

<input
    id="hidden-input"
    type="text"
    autocomplete="off"
    autocorrect="off"
    autocapitalize="off"
    spellcheck="false"
/>
