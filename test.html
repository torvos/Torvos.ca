<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Torvos - Test Suite</title>
    <style>
        body {
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            background: #0d0d0d;
            color: #ddd;
            margin: 0;
            padding: 24px;
        }
        #test-page {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            font-size: 1.1em;
            color: #66ff99;
            margin-bottom: 4px;
        }
        #test-page > p {
            color: #888;
            margin-top: 0;
            font-size: 0.9em;
        }
        #test-output {
            white-space: pre-wrap;
            font-size: 0.9em;
            line-height: 1.5;
        }
        .test-file-header {
            color: #66ccff;
            font-weight: bold;
            margin-top: 1.2em;
        }
        .test-ok {
            color: #66ff99;
        }
        .test-fail {
            color: #ff6060;
        }
        .test-fail-detail {
            color: #ff9c9c;
            margin-left: 2em;
        }
        #test-summary {
            font-size: 1.1em;
            font-weight: bold;
            margin-top: 1.5em;
            padding-top: 0.5em;
            border-top: 1px solid #333;
        }
        /* Real terminal DOM, present so TerminalEngine can bind to real
           elements instead of needing stubs - just kept off-screen. */
        #terminal-fixture {
            position: absolute;
            left: -9999px;
            top: -9999px;
            width: 1px;
            height: 1px;
            overflow: hidden;
        }
    </style>
</head>
<body>

<div id="test-page">
    <h1>Torvos - Test Suite</h1>
    <p>Boots the real app in this tab (an isolated session - your saved terminal session elsewhere is untouched) and runs every test in tests/*.test.js against it.</p>
    <div id="test-output">Booting&hellip;</div>
</div>

<div id="terminal-fixture" aria-hidden="true">
    <div id="terminal-container">
        <main id="terminal">
            <div id="output"></div>
            <div id="input-line">
                <span id="prompt"></span>
                <span id="command"></span>
            </div>
            <div id="editor-container">
                <div id="editor-header"></div>
                <textarea id="editor"></textarea>
            </div>
            <div id="scroll-anchor"></div>
        </main>
    </div>
    <div id="mobile-toolbar">
        <button type="button" id="mobile-tab-btn">Tab</button>
        <button type="button" id="mobile-esc-btn">Esc</button>
    </div>
    <input
        id="hidden-input"
        type="text"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
    />
</div>

<!-- Isolates localStorage before anything else can touch it - see the
     comment in the file itself for why this has to load first. -->
<script src="tests/isolate-storage.js"></script>

<!-- Same app scripts as index.html, in the same order, minus app.js -
     app.js auto-boots a terminal bound to the real page on
